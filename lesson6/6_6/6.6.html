<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="6.6.css">
</head>
<body>
<form class="form-registration">
    <label for="name">Enter your name</label>
    <input type="text" name="name" placeholder="Name" id="name" required><sup>*</sup>

    <label for="email">Enter your email</label>
    <input type="email" name="email" placeholder="111@gmail.com" id="email" required><sup>*</sup>

    <label for="password">Enter your password</label>
    <input type="password" name="password" placeholder="Enter password" id="password"><sup>*</sup>

    <label for="age"></label>
    <input type="number" name="age" id="age" min="18" max="100">

    <label >Gender</label>
    <label><input type="radio" name="gender" value="male">Male</label>
    <label><input type="radio" name="gender" value="female">Female</label>
    <label><input type="radio" name="gender" value="other">Other</label>

    <label>
        <input type="checkbox" name="updates"> Sign for the updates
    </label>


    <label for="lorem">Coutry</label>
    <select id="lorem">
        <option value="">choose country</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="germany">Germany</option>
        <option value="ukraine">Ukraine</option>
    </select>
    <label for="phone"></label>

    <select id="phone">
        <optgroup label="Apple">
            <option value="iphone13">Iphone 13</option>
            <option value="iphone14">Iphone 14</option>
            <option value="iphone15">Iphone 15</option>

        </optgroup>

        <optgroup label="Samsung">

            <option value="s13">Samsung 13</option>
            <option value="s14">Samsung 14</option>
            <option value="s15">Samsung 15</option>

        </optgroup>
    </select>

    <label for="comment"></label>
    <textarea id="comment" rows="4" cols="30"></textarea>

    <div>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>
</form>
</body>
</html>
